name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release, for example 0.2.0 or 0.2.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Validate branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Release must run from ${DEFAULT_BRANCH}. Current ref is ${GITHUB_REF}."
            exit 1
          fi

      - name: Validate version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: vp run release:version -- validate

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Check i18n
        run: vp run i18n:check

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs:
      - prepare
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin
            artifact: release-macos
          - name: Windows
            os: windows-latest
            platform: win32
            artifact: release-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: vp run release:version -- write

      - name: Build package
        run: vp run make -- --platform=${{ matrix.platform }}

      - name: Check artifacts
        shell: bash
        run: |
          if [ ! -d out/make ] || [ -z "$(find out/make -type f -print -quit)" ]; then
            echo "No release artifacts found in out/make."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    needs:
      - prepare
      - build
    permissions:
      contents: write

    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git fetch --tags --force
          vp run release:version -- validate

      - name: Commit version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          vp run release:version -- write

          git config user.name "fluxnotes-release-bot[bot]"
          git config user.email "fluxnotes-release-bot[bot]@users.noreply.github.com"
          git add package.json

          if git diff --cached --quiet; then
            echo "package.json is already at ${RELEASE_VERSION}."
          else
            git commit -m "chore(release): ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: release-artifacts/**/*
          fail_on_unmatched_files: true
