name: Release
run-name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15.0"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check

      - name: Test
        run: vp run test

      - name: Check i18n
        run: vp run i18n:check

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs:
      - release
      - verify
    if: needs.release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin
            artifact: release-macos
          - name: Windows
            os: windows-latest
            platform: win32
            artifact: release-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15.0"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Prepare macOS signing credentials
        if: matrix.platform == 'darwin'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: vp run release:macos -- prepare

      - name: Verify PostHog secrets
        env:
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        shell: bash
        run: |
          if [ -z "$POSTHOG_HOST" ] || [ -z "$POSTHOG_KEY" ]; then
            echo "POSTHOG_HOST and POSTHOG_KEY secrets are required for release builds."
            exit 1
          fi

      - name: Build package
        env:
          VITE_FLUXNOTES_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          VITE_FLUXNOTES_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: vp run make -- --platform=${{ matrix.platform }}

      - name: Notarize macOS disk image
        if: matrix.platform == 'darwin'
        run: vp run release:macos -- notarize-dmg

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'darwin'
        run: vp run release:macos -- verify

      - name: Check artifacts
        shell: bash
        run: |
          if [ ! -d apps/desktop/out/make ] || [ -z "$(find apps/desktop/out/make -type f -print -quit)" ]; then
            echo "No release artifacts found in apps/desktop/out/make."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error

      - name: Clean up macOS signing keychain
        if: always() && matrix.platform == 'darwin'
        run: vp run release:macos -- cleanup

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - release
      - build
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=()

          for file in release-artifacts/**/*; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false
