name: Release PR
run-name: Release PR

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Release Merge
    runs-on: ubuntu-latest
    outputs:
      is_release_merge: ${{ steps.detect.outputs.is_release_merge }}

    steps:
      - name: Detect release merge commit
        id: detect
        env:
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          subject="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ "$subject" =~ ^chore\(master\):\ release(\ [0-9]+\.[0-9]+\.[0-9]+(\-[0-9A-Za-z.-]+)?)?\ \(#[0-9]+\)$ ]] \
            && [[ "$AUTHOR_NAME" == "fluxnotes-release-bot[bot]" ]] \
            && [[ "$AUTHOR_EMAIL" == "285336738+fluxnotes-release-bot[bot]@users.noreply.github.com" ]]; then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.is_release_merge != 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
