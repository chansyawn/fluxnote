name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | vp exec commitlint

      - name: Check
        run: vp check

      - name: Test
        run: vp run test

      - name: Check i18n
        run: vp run i18n:check

      - name: Build package
        run: vp run package
