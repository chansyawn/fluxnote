packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
catalogMode: prefer
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - fs-xattr
  - macos-alias
catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  "@lingui/vite-plugin": 6.0.1
  "@rolldown/plugin-babel": ^0.2.2
  "@tailwindcss/vite": ^4.2.2
  "@lingui/babel-plugin-lingui-macro": 6.0.1
  babel-plugin-react-compiler: ^1.0.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  msw: true
  protobufjs: true
